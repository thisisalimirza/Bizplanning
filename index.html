<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Growth Journey - Personalized Compound Growth Calculator</title>
    <meta name="description" content="See what YOUR business could become. Start from where YOU are right now.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1a1a2e;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .onboarding {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 0.6s ease-in;
        }

        .onboarding h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 16px;
            color: #1a1a2e;
        }

        .onboarding p {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .input-large {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            font-size: 24px;
            border: 3px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 16px;
            transition: border-color 0.3s ease;
        }

        .input-large:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .dashboard {
            display: none;
            animation: fadeIn 0.6s ease-in;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: clamp(24px, 4vw, 36px);
            margin-bottom: 8px;
        }

        .header .current {
            font-size: 48px;
            font-weight: bold;
            color: #3b82f6;
            margin: 16px 0;
        }

        .edit-btn {
            display: inline-block;
            color: #3b82f6;
            font-size: 14px;
            text-decoration: none;
            margin-top: 8px;
            cursor: pointer;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section h2 {
            font-size: 28px;
            margin-bottom: 24px;
            color: #1a1a2e;
        }

        .section h3 {
            font-size: 20px;
            margin: 24px 0 16px 0;
            color: #374151;
        }

        .milestone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .milestone {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }

        .milestone .target {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .milestone .time {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .milestone .context {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 8px;
            line-height: 1.4;
        }

        .growth-option {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .growth-option h4 {
            color: #1a1a2e;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .growth-option .result {
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
            margin-bottom: 8px;
        }

        .growth-option .timeline {
            color: #6b7280;
            margin-bottom: 12px;
        }

        .insight-box {
            background: #fef3c7;
            border: 2px solid #fbbf24;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .insight-box .title {
            font-size: 18px;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 8px;
        }

        .insight-box .text {
            color: #78350f;
            line-height: 1.6;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
        }

        .comparison-table th {
            background: #f9fafb;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
        }

        .comparison-table td {
            padding: 16px 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .comparison-table .month {
            font-weight: 600;
            color: #374151;
        }

        .comparison-table .revenue {
            font-weight: bold;
            color: #1a1a2e;
        }

        .comparison-table .change {
            color: #10b981;
            font-size: 14px;
        }

        .zero-state {
            text-align: center;
            padding: 40px 20px;
        }

        .zero-state h2 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .zero-state p {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .path-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .path-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .path-card h4 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #1a1a2e;
        }

        .path-card .description {
            color: #6b7280;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .path-card .examples {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #374151;
        }

        .highlight {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 32px;
            border-radius: 16px;
            margin: 24px 0;
            text-align: center;
        }

        .highlight .big {
            font-size: 48px;
            font-weight: bold;
            margin: 16px 0;
        }

        .slider-container {
            margin: 32px 0;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #e5e7eb;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: none;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 14px;
            color: #6b7280;
        }

        .slider-value {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #3b82f6;
            margin: 16px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .onboarding {
                padding: 32px 20px;
            }
            .header, .section {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Onboarding Screen -->
        <div id="onboarding" class="onboarding">
            <h1>Your Growth Journey Starts Here</h1>
            <p>Let's see what YOUR business could become.<br>Start by telling me where you are right now.</p>

            <div style="margin: 32px 0;">
                <label style="display: block; margin-bottom: 12px; font-size: 18px; font-weight: 600;">What's your current monthly revenue?</label>
                <input type="number" id="startRevenue" class="input-large" placeholder="$0" min="0">
                <div style="font-size: 14px; color: #6b7280; margin-top: 8px;">Enter $0 if you haven't made your first sale yet</div>
            </div>

            <button class="btn-primary" onclick="startJourney()">Show Me My Future</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <div class="header">
                <div style="font-size: 14px; color: #6b7280; text-transform: uppercase; font-weight: 600; margin-bottom: 8px;">You're Currently At</div>
                <div class="current" id="currentRevenue">$0</div>
                <a class="edit-btn" onclick="resetJourney()">← Start Over</a>
            </div>

            <div id="content"></div>
        </div>
    </div>

    <script>
        let currentRevenue = 0;

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(value);
        }

        function calculateMonths(start, end, growthRate) {
            if (start >= end || growthRate <= 0) return 0;
            return Math.log(end / start) / Math.log(1 + growthRate / 100);
        }

        function calculateRevenue(start, months, growthRate) {
            return start * Math.pow(1 + growthRate / 100, months);
        }

        function startJourney() {
            currentRevenue = parseFloat(document.getElementById('startRevenue').value) || 0;
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('currentRevenue').textContent = formatCurrency(currentRevenue);

            if (currentRevenue === 0) {
                showZeroState();
            } else {
                showGrowthJourney();
            }
        }

        function resetJourney() {
            document.getElementById('onboarding').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('startRevenue').value = '';
        }

        function showZeroState() {
            const content = document.getElementById('content');

            content.innerHTML = `
                <div class="section zero-state">
                    <h2>🚀 Let's Make Your First Sale</h2>
                    <p>You haven't made your first dollar online yet - but you're about to.<br>Here's what getting to your first milestones could look like:</p>
                </div>

                <div class="section">
                    <h2>Your First $100/Month</h2>
                    <p style="color: #6b7280; margin-bottom: 24px;">This is the hardest milestone. Once you hit this, everything changes.</p>

                    <div class="path-card">
                        <h4>💼 Freelancing/Services</h4>
                        <p class="description">Sell your skills directly. One client paying $100/month, or 5 clients at $20/month.</p>
                        <div class="examples">
                            <strong>Examples:</strong> Writing, design, VA work, social media management, consulting
                        </div>
                    </div>

                    <div class="path-card">
                        <h4>📝 Digital Products</h4>
                        <p class="description">Create once, sell many times. 10 sales of a $10 product, or 2 sales of a $50 course.</p>
                        <div class="examples">
                            <strong>Examples:</strong> Templates, guides, mini-courses, Notion templates, spreadsheets
                        </div>
                    </div>

                    <div class="path-card">
                        <h4>🎨 Content + Monetization</h4>
                        <p class="description">Build an audience, monetize it. YouTube, blog, newsletter, TikTok.</p>
                        <div class="examples">
                            <strong>Examples:</strong> Ad revenue, sponsorships, affiliate links, tips/donations
                        </div>
                    </div>

                    <div class="path-card">
                        <h4>🛍️ E-commerce/Dropshipping</h4>
                        <p class="description">Sell physical or digital products. Need ~3-5 sales depending on margins.</p>
                        <div class="examples">
                            <strong>Examples:</strong> Print on demand, dropshipping, handmade items, reselling
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Once You Hit $100/Month...</h2>

                    <div class="highlight">
                        <div>If you grow at just 10% per month:</div>
                        <div class="big">$313/mo</div>
                        <div>in 12 months</div>
                    </div>

                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>Month</th>
                                <th>At 10% Growth</th>
                                <th>At 15% Growth</th>
                                <th>At 20% Growth</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${generateZeroGrowthTable()}
                        </tbody>
                    </table>

                    <div class="insight-box">
                        <div class="title">💡 The Truth About $100/Month</div>
                        <div class="text">
                            $100/month proves you can make money online. It proves someone will pay you.
                            Most people never get here - they give up at $0. Once you're at $100,
                            getting to $1,000 is just consistency. Don't underestimate this milestone.
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Your Path: $0 → $100 → $500 → $1,000</h2>
                    <p style="color: #6b7280; margin-bottom: 24px;">Here's what these milestones mean for YOUR life:</p>

                    <div class="growth-option">
                        <h4>$100/month = Your First Proof</h4>
                        <p style="color: #6b7280;">You can make money online. This changes everything psychologically.</p>
                    </div>

                    <div class="growth-option">
                        <h4>$500/month = Covers Some Bills</h4>
                        <p style="color: #6b7280;">Phone bill, groceries, car payment. Real impact on your life.</p>
                    </div>

                    <div class="growth-option">
                        <h4>$1,000/month = Part-Time Income</h4>
                        <p style="color: #6b7280;">This is what many people make at part-time jobs. You're doing it online.</p>
                    </div>

                    <div class="growth-option">
                        <h4>$3,000/month = Full-Time Possible</h4>
                        <p style="color: #6b7280;">In many places, this is enough to consider going full-time.</p>
                    </div>
                </div>
            `;
        }

        function generateZeroGrowthTable() {
            let html = '';
            const start = 100;
            const growthRates = [10, 15, 20];

            for (let month of [1, 3, 6, 9, 12]) {
                html += '<tr>';
                html += `<td class="month">Month ${month}</td>`;
                growthRates.forEach(rate => {
                    const value = calculateRevenue(start, month, rate);
                    html += `<td class="revenue">${formatCurrency(value)}</td>`;
                });
                html += '</tr>';
            }
            return html;
        }

        function showGrowthJourney() {
            const content = document.getElementById('content');

            // Determine milestones based on current revenue
            const milestones = getMilestones(currentRevenue);
            const stage = getStage(currentRevenue);

            content.innerHTML = `
                <div class="section">
                    <h2>Your Next Milestones</h2>
                    <p style="color: #6b7280; margin-bottom: 24px;">
                        ${stage.message}
                    </p>

                    <div class="milestone-grid">
                        ${milestones.map(m => `
                            <div class="milestone">
                                <div class="target">${formatCurrency(m.target)}</div>
                                <div class="time">${m.months} months at 4% growth</div>
                                <div class="context">${m.context}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="insight-box">
                        <div class="title">🎯 ${stage.insight.title}</div>
                        <div class="text">${stage.insight.text}</div>
                    </div>
                </div>

                <div class="section">
                    <h2>What Does 4% Monthly Growth Mean For YOU?</h2>

                    <div class="highlight">
                        <div>Starting from ${formatCurrency(currentRevenue)}</div>
                        <div class="big">${formatCurrency(calculateRevenue(currentRevenue, 12, 4))}</div>
                        <div>in just 12 months at 4% monthly growth</div>
                    </div>

                    <div style="margin: 32px 0;">
                        <h3>Your Month-by-Month Journey</h3>
                        <table class="comparison-table">
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>Your Revenue</th>
                                    <th>Monthly Growth</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${generateGrowthTable(currentRevenue, 4)}
                            </tbody>
                        </table>
                    </div>

                    ${currentRevenue >= 3 && currentRevenue <= 5000 ? `
                        <div class="insight-box">
                            <div class="title">🚀 You're Building Something Real</div>
                            <div class="text">
                                At ${formatCurrency(currentRevenue)}/month, you're past the hardest part - getting started.
                                Most people never get here. 4% monthly growth from where you are means
                                ${formatCurrency(calculateRevenue(currentRevenue, 12, 4))} in a year,
                                ${formatCurrency(calculateRevenue(currentRevenue, 24, 4))} in 2 years.
                                Don't quit now. You're on a rocket ship.
                            </div>
                        </div>
                    ` : ''}
                </div>

                <div class="section">
                    <h2>Play With Your Future</h2>
                    <p style="color: #6b7280; margin-bottom: 24px;">
                        Adjust the growth rate to see different scenarios for YOUR business
                    </p>

                    <div class="slider-container">
                        <label style="font-weight: 600; margin-bottom: 16px; display: block;">Monthly Growth Rate</label>
                        <input type="range" class="slider" id="growthSlider" min="1" max="20" value="4" step="0.5" oninput="updateGrowthScenario()">
                        <div class="slider-label">
                            <span>1%</span>
                            <span>20%</span>
                        </div>
                        <div class="slider-value" id="sliderValue">4%</div>
                    </div>

                    <div id="scenarioResults"></div>
                </div>

                <div class="section">
                    <h2>Compare: What If You Grow Faster?</h2>
                    <p style="color: #6b7280; margin-bottom: 24px;">
                        Small changes in growth rate = massive differences in YOUR outcome
                    </p>

                    ${generateComparisonCards(currentRevenue)}
                </div>

                <div class="section">
                    <h2>What YOU Need to Hit Your Next Big Goal</h2>
                    ${generateGoalCalculator(currentRevenue)}
                </div>

                <div class="section" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                    <h2 style="color: white;">Your Reality Check</h2>
                    <p style="margin-bottom: 24px; opacity: 0.95; font-size: 16px; line-height: 1.6;">
                        ${getPersonalizedMotivation(currentRevenue)}
                    </p>
                </div>
            `;

            updateGrowthScenario();
        }

        function getMilestones(revenue) {
            if (revenue < 100) {
                return [
                    { target: 100, months: Math.ceil(calculateMonths(revenue, 100, 4)), context: "Your first $100 - proves you can do this" },
                    { target: 500, months: Math.ceil(calculateMonths(revenue, 500, 4)), context: "Covers some real bills" },
                    { target: 1000, months: Math.ceil(calculateMonths(revenue, 1000, 4)), context: "Part-time income level" },
                ];
            } else if (revenue < 1000) {
                return [
                    { target: 1000, months: Math.ceil(calculateMonths(revenue, 1000, 4)), context: "Part-time income level" },
                    { target: 2000, months: Math.ceil(calculateMonths(revenue, 2000, 4)), context: "Serious side income" },
                    { target: 5000, months: Math.ceil(calculateMonths(revenue, 5000, 4)), context: "Could go full-time in some areas" },
                ];
            } else if (revenue < 5000) {
                return [
                    { target: 5000, months: Math.ceil(calculateMonths(revenue, 5000, 4)), context: "Full-time territory" },
                    { target: 10000, months: Math.ceil(calculateMonths(revenue, 10000, 4)), context: "Comfortable living" },
                    { target: 20000, months: Math.ceil(calculateMonths(revenue, 20000, 4)), context: "Strong business" },
                ];
            } else if (revenue < 20000) {
                return [
                    { target: 20000, months: Math.ceil(calculateMonths(revenue, 20000, 4)), context: "Strong business" },
                    { target: 50000, months: Math.ceil(calculateMonths(revenue, 50000, 4)), context: "Life-changing income" },
                    { target: 100000, months: Math.ceil(calculateMonths(revenue, 100000, 4)), context: "Six figures monthly" },
                ];
            } else {
                return [
                    { target: 50000, months: Math.ceil(calculateMonths(revenue, 50000, 4)), context: "Life-changing income" },
                    { target: 100000, months: Math.ceil(calculateMonths(revenue, 100000, 4)), context: "Six figures monthly" },
                    { target: 200000, months: Math.ceil(calculateMonths(revenue, 200000, 4)), context: "Elite territory" },
                ];
            }
        }

        function getStage(revenue) {
            if (revenue < 100) {
                return {
                    message: "You're in the bootstrap phase. Every dollar counts right now.",
                    insight: {
                        title: "The First $100 Changes Everything",
                        text: "This isn't about the money - it's about proof. Once you hit $100/month, you know you can make money online. That changes your entire psychology."
                    }
                };
            } else if (revenue < 1000) {
                return {
                    message: "You've proven you can make money online. Now it's about consistency and growth.",
                    insight: {
                        title: "You're Past the Hardest Part",
                        text: `At ${formatCurrency(revenue)}/month, you're further than 90% of people who start. Most quit before they ever make a dollar. You didn't. Now just keep going.`
                    }
                };
            } else if (revenue < 5000) {
                return {
                    message: "This is real money. You're building a real business.",
                    insight: {
                        title: "You're Building Something Substantial",
                        text: `${formatCurrency(revenue)}/month is more than most part-time jobs pay. And you're doing this online. At 4% monthly growth, you'll be at ${formatCurrency(calculateRevenue(revenue, 18, 4))}/month in 18 months. Keep going.`
                    }
                };
            } else if (revenue < 20000) {
                return {
                    message: "You have a real business. This is full-time income territory.",
                    insight: {
                        title: "You're Already Winning",
                        text: `${formatCurrency(revenue)}/month is life-changing money. If you maintain just 4% monthly growth, you'll 4x this in 3 years. Most businesses would kill for this position.`
                    }
                };
            } else {
                return {
                    message: "You're running a serious business. This is about scale now.",
                    insight: {
                        title: "You've Made It",
                        text: `${formatCurrency(revenue)}/month puts you in elite territory. At this level, 4% monthly growth means adding ${formatCurrency(revenue * 0.04)} in new revenue every single month. That's the power of compounding on a large base.`
                    }
                };
            }
        }

        function generateGrowthTable(start, rate) {
            let html = '';
            let current = start;

            for (let month = 0; month <= 12; month++) {
                const prev = current;
                current = month === 0 ? start : calculateRevenue(start, month, rate);
                const change = month === 0 ? 0 : current - calculateRevenue(start, month - 1, rate);

                html += `
                    <tr>
                        <td class="month">${month === 0 ? 'Start' : 'Month ' + month}</td>
                        <td class="revenue">${formatCurrency(current)}</td>
                        <td class="change">${month === 0 ? '-' : '+' + formatCurrency(change)}</td>
                    </tr>
                `;
            }
            return html;
        }

        function generateComparisonCards(start) {
            const rates = [2, 4, 6, 8];
            return rates.map(rate => {
                const result = calculateRevenue(start, 12, rate);
                const increase = result - start;
                return `
                    <div class="growth-option">
                        <h4>${rate}% Monthly Growth</h4>
                        <div class="result">${formatCurrency(result)}</div>
                        <div class="timeline">In 12 months | +${formatCurrency(increase)} total</div>
                        <p style="color: #6b7280; font-size: 14px; margin-top: 8px;">
                            That's +${formatCurrency(increase / 12)}/month on average
                        </p>
                    </div>
                `;
            }).join('');
        }

        function generateGoalCalculator(start) {
            const nextMilestone = getMilestones(start)[1].target;
            const required4 = Math.ceil(calculateMonths(start, nextMilestone, 4));
            const required6 = Math.ceil(calculateMonths(start, nextMilestone, 6));
            const required8 = Math.ceil(calculateMonths(start, nextMilestone, 8));

            return `
                <p style="color: #6b7280; margin-bottom: 24px;">
                    To get from ${formatCurrency(start)} to ${formatCurrency(nextMilestone)}:
                </p>

                <div class="growth-option">
                    <h4>At 4% Monthly Growth</h4>
                    <div class="result">${required4} months</div>
                    <p style="color: #6b7280;">Steady, sustainable pace</p>
                </div>

                <div class="growth-option">
                    <h4>At 6% Monthly Growth</h4>
                    <div class="result">${required6} months</div>
                    <p style="color: #6b7280;">Aggressive but achievable</p>
                </div>

                <div class="growth-option">
                    <h4>At 8% Monthly Growth</h4>
                    <div class="result">${required8} months</div>
                    <p style="color: #6b7280;">Hyper-growth mode</p>
                </div>
            `;
        }

        function updateGrowthScenario() {
            const rate = parseFloat(document.getElementById('growthSlider').value);
            document.getElementById('sliderValue').textContent = rate + '%';

            const result12 = calculateRevenue(currentRevenue, 12, rate);
            const result24 = calculateRevenue(currentRevenue, 24, rate);
            const result36 = calculateRevenue(currentRevenue, 36, rate);

            document.getElementById('scenarioResults').innerHTML = `
                <div class="highlight">
                    <div>At ${rate}% monthly growth from ${formatCurrency(currentRevenue)}:</div>
                    <div class="big">${formatCurrency(result12)}</div>
                    <div>in 12 months</div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 24px;">
                    <div class="growth-option">
                        <h4>12 Months</h4>
                        <div class="result">${formatCurrency(result12)}</div>
                        <p style="color: #6b7280; font-size: 14px;">+${formatCurrency(result12 - currentRevenue)}</p>
                    </div>
                    <div class="growth-option">
                        <h4>24 Months</h4>
                        <div class="result">${formatCurrency(result24)}</div>
                        <p style="color: #6b7280; font-size: 14px;">+${formatCurrency(result24 - currentRevenue)}</p>
                    </div>
                    <div class="growth-option">
                        <h4>36 Months</h4>
                        <div class="result">${formatCurrency(result36)}</div>
                        <p style="color: #6b7280; font-size: 14px;">+${formatCurrency(result36 - currentRevenue)}</p>
                    </div>
                </div>

                <div class="insight-box" style="margin-top: 24px;">
                    <div class="title">💰 What This Means For YOU</div>
                    <div class="text">
                        At ${rate}% monthly, you're adding an average of ${formatCurrency((result12 - currentRevenue) / 12)}/month
                        over the next year. That's real money adding up month after month.
                        In 3 years, you'd ${result36 >= currentRevenue * 2 ? 'more than double' : 'significantly grow'} your business to ${formatCurrency(result36)}/month.
                    </div>
                </div>
            `;
        }

        function getPersonalizedMotivation(revenue) {
            if (revenue < 100) {
                return `You're at the starting line. Most people never even get here - they just think about it. You're actually doing it. Get to that first $100. Once you do, you'll realize you can do anything.`;
            } else if (revenue < 1000) {
                return `You're making ${formatCurrency(revenue)}/month online. You've already done what 95% of people who "want to start a business" never do. You've proven you can make money on the internet. Now it's just about stacking more wins. Don't you dare quit.`;
            } else if (revenue < 5000) {
                return `${formatCurrency(revenue)}/month is real money. You're not dabbling anymore - you're building a real business. At 4% monthly growth, you'll be at ${formatCurrency(calculateRevenue(revenue, 24, 4))}/month in 2 years. That's full-time income in most places. Keep going.`;
            } else if (revenue < 20000) {
                return `You're at ${formatCurrency(revenue)}/month. This is full-time income. This is life-changing money. And if you just maintain 4% growth - which is modest and sustainable - you'll be at ${formatCurrency(calculateRevenue(revenue, 36, 4))}/month in 3 years. Let that sink in.`;
            } else {
                return `${formatCurrency(revenue)}/month puts you in the top 1% of online businesses. You've already made it. Now it's about scale. Even 4% monthly growth means you're adding ${formatCurrency(revenue * 0.04)} in NEW revenue every single month. That's what compounding on a big base looks like. Don't stop now.`;
            }
        }
    </script>
</body>
</html>
