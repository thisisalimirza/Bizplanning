<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Calculator - You Think You're Failing. You're Actually Winning.</title>
    <meta name="description" content="That 4% monthly growth feels pathetic, but it's actually 60% per year. See why you're winning when you think you're losing.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .onboarding {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .onboarding .logo {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #00d09c 0%, #00b37e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .onboarding h1 {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .onboarding .tagline {
            font-size: clamp(18px, 3vw, 24px);
            color: #999;
            margin-bottom: 48px;
            max-width: 600px;
        }

        .input-wrapper {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
            max-width: 500px;
            width: 100%;
        }

        .input-wrapper label {
            display: block;
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-large {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 36px;
            font-weight: 700;
            color: #00d09c;
            padding: 8px 0;
            outline: none;
        }

        .input-large::placeholder {
            color: #444;
        }

        .btn-primary {
            background: #00d09c;
            color: #0d0d0d;
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #00b37e;
            transform: translateY(-2px);
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            padding: 24px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 32px;
        }

        .header .logo-small {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d09c 0%, #00b37e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .portfolio-value {
            margin: 32px 0;
        }

        .portfolio-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .portfolio-amount {
            font-size: 56px;
            font-weight: 700;
            color: #00d09c;
            margin-bottom: 16px;
        }

        .portfolio-change {
            font-size: 18px;
            color: #00d09c;
        }

        .portfolio-change.negative {
            color: #ff6b6b;
        }

        .tabs {
            display: flex;
            gap: 32px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 32px;
            overflow-x: auto;
        }

        .tab {
            background: none;
            border: none;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            padding: 16px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab.active {
            color: #00d09c;
            border-bottom-color: #00d09c;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric {
            background: #0d0d0d;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }

        .metric-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .metric-subtext {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .gain {
            color: #00d09c;
        }

        .loss {
            color: #ff6b6b;
        }

        .comparison-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .comparison-title {
            font-size: 16px;
            font-weight: 600;
        }

        .comparison-badge {
            background: #00d09c;
            color: #0d0d0d;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .comparison-value {
            font-size: 32px;
            font-weight: 700;
            color: #00d09c;
            margin-bottom: 8px;
        }

        .comparison-description {
            color: #999;
            line-height: 1.6;
        }

        .progress-bar {
            background: #2a2a2a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;
        }

        .progress-fill {
            background: #00d09c;
            height: 100%;
            transition: width 0.3s ease;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #2a2a2a;
        }

        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-dot {
            width: 12px;
            height: 12px;
            background: #00d09c;
            border-radius: 50%;
            margin-right: 16px;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .timeline-content h4 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .timeline-content p {
            color: #999;
            line-height: 1.6;
        }

        .highlight-box {
            background: linear-gradient(135deg, #00d09c 0%, #00b37e 100%);
            color: #0d0d0d;
            padding: 32px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }

        .highlight-box .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .highlight-box .value {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .highlight-box .subtitle {
            font-size: 18px;
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a2a;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .slider-container {
            margin: 32px 0;
        }

        .slider {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #2a2a2a;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d09c;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d09c;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #00d09c;
            margin: 16px 0;
        }

        .info-badge {
            display: inline-block;
            background: #2a2a2a;
            color: #999;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
        }

        .zero-state-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .zero-state-card:hover {
            border-color: #00d09c;
        }

        .zero-state-card h4 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .zero-state-card .description {
            color: #999;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .zero-state-card .examples {
            background: #0d0d0d;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .edit-link {
            color: #00d09c;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .edit-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animated {
            animation: fadeIn 0.6s ease-out;
        }

        @media (max-width: 640px) {
            .portfolio-amount {
                font-size: 40px;
            }
            .metric-value {
                font-size: 20px;
            }
            .tabs {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Onboarding -->
        <div id="onboarding" class="onboarding animated">
            <div class="logo">Growth Calculator</div>
            <h1>You Think You're Failing.<br>You're Actually Winning.</h1>
            <p class="tagline">
                That "pathetic" 4% monthly growth you're beating yourself up about?
                It's actually incredible. Let me show you why.
            </p>

            <div class="input-wrapper">
                <label>How much are you making per month right now?</label>
                <input type="number" id="startRevenue" class="input-large" placeholder="$0" min="0">
            </div>

            <button class="btn-primary" onclick="startJourney()">Show Me the Truth</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <div class="header">
                <div class="logo-small">Growth Calculator</div>
                <a class="edit-link" onclick="resetJourney()">← Change My Numbers</a>
            </div>

            <div class="portfolio-value animated">
                <div class="portfolio-label">You're Making</div>
                <div class="portfolio-amount" id="currentRevenue">$0</div>
                <div class="portfolio-change" id="projectedChange">Loading...</div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('overview')">The Truth</button>
                <button class="tab" onclick="switchTab('projections')">Your Future</button>
                <button class="tab" onclick="switchTab('comparison')">vs Getting a Job</button>
                <button class="tab" onclick="switchTab('milestones')">Next Goals</button>
            </div>

            <div id="content"></div>
        </div>
    </div>

    <script>
        let currentRevenue = 0;
        const SP500_AVG_RETURN = 10; // 10% annual return

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(value);
        }

        function calculateMonths(start, end, growthRate) {
            if (start >= end || growthRate <= 0) return 0;
            return Math.log(end / start) / Math.log(1 + growthRate / 100);
        }

        function calculateRevenue(start, months, growthRate) {
            return start * Math.pow(1 + growthRate / 100, months);
        }

        function startJourney() {
            currentRevenue = parseFloat(document.getElementById('startRevenue').value) || 0;
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('currentRevenue').textContent = formatCurrency(currentRevenue);

            if (currentRevenue === 0) {
                document.getElementById('projectedChange').innerHTML = '<span class="info-badge">Pre-Revenue</span>';
            } else {
                const yearProjection = calculateRevenue(currentRevenue, 12, 4);
                const change = yearProjection - currentRevenue;
                const changePercent = (change / currentRevenue) * 100;
                document.getElementById('projectedChange').innerHTML =
                    `<span class="gain">+${formatCurrency(change)} (${changePercent.toFixed(1)}%) projected at 4% monthly</span>`;
            }

            switchTab('overview');
        }

        function resetJourney() {
            document.getElementById('onboarding').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('startRevenue').value = '';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            if (currentRevenue === 0) {
                showZeroState();
            } else {
                switch(tabName) {
                    case 'overview':
                        showOverview();
                        break;
                    case 'projections':
                        showProjections();
                        break;
                    case 'comparison':
                        showComparison();
                        break;
                    case 'milestones':
                        showMilestones();
                        break;
                }
            }
        }

        function showZeroState() {
            // This function will be fully implemented with $0 state
            document.getElementById('content').innerHTML = `
                <div class="card animated">
                    <h3>🚀 Making Your First Sale</h3>
                    <p style="color: #999; margin-bottom: 24px;">You're pre-revenue. Here's how to bootstrap to your first $100/month:</p>

                    ${['Freelancing/Services', 'Digital Products', 'Content + Ads', 'E-commerce'].map(path => `
                        <div class="zero-state-card">
                            <h4>${path}</h4>
                            <p class="description">Start earning immediately with your existing skills.</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showOverview() {
            const year1 = calculateRevenue(currentRevenue, 12, 4);
            const year3 = calculateRevenue(currentRevenue, 36, 4);
            const year5 = calculateRevenue(currentRevenue, 60, 4);
            const year10 = calculateRevenue(currentRevenue, 120, 4);
            const monthlyIncrease = currentRevenue * 0.04;

            document.getElementById('content').innerHTML = `
                <div class="card animated" style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);">
                    <h3 style="font-size: 24px; margin-bottom: 16px;">Here's the truth:</h3>
                    <p style="color: #999; font-size: 18px; line-height: 1.8; margin-bottom: 24px;">
                        If you're growing at just <strong style="color: #00d09c;">4% per month</strong>, it feels like nothing.
                        Like you're barely moving. Like everyone else is crushing it and you're stuck.
                    </p>
                    <p style="color: #fff; font-size: 20px; line-height: 1.8;">
                        But here's what's actually happening: <strong style="color: #00d09c;">You're growing at 60% per year.</strong>
                        <br><br>
                        That's not slow. That's exceptional. Most businesses don't grow like that. Most <em>investments</em> don't grow like that.
                    </p>
                </div>

                <div class="highlight-box animated">
                    <div class="title">What "Just 4% Monthly" Actually Means</div>
                    <div class="value">${formatCurrency(year1)}/month</div>
                    <div class="subtitle">in 1 year • That's ${formatCurrency(year1 * 12)} per year</div>
                </div>

                <div class="card animated">
                    <h3>Let's Do the Math (It's Simple)</h3>
                    <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 16px;">
                        <p style="color: #999; line-height: 1.8; margin-bottom: 16px;">
                            You're making <strong style="color: #fff;">${formatCurrency(currentRevenue)}</strong> per month right now.
                        </p>
                        <p style="color: #999; line-height: 1.8; margin-bottom: 16px;">
                            If you grow by 4% each month, you're adding <strong style="color: #00d09c;">${formatCurrency(monthlyIncrease)}</strong> next month.
                        </p>
                        <p style="color: #999; line-height: 1.8; margin-bottom: 16px;">
                            Doesn't sound like much, right? That's why it feels slow.
                        </p>
                        <p style="color: #fff; font-size: 18px; line-height: 1.8; margin-top: 24px;">
                            But in <strong style="color: #00d09c;">1 year</strong>, you'll be making <strong style="color: #00d09c;">${formatCurrency(year1)}</strong>/month.
                            <br>
                            In <strong style="color: #00d09c;">3 years</strong>, you'll be making <strong style="color: #00d09c;">${formatCurrency(year3)}</strong>/month.
                            <br>
                            In <strong style="color: #00d09c;">5 years</strong>, you'll be making <strong style="color: #00d09c;">${formatCurrency(year5)}</strong>/month.
                            <br>
                            In <strong style="color: #00d09c;">10 years</strong>? <strong style="color: #00d09c;">${formatCurrency(year10)}</strong>/month.
                        </p>
                    </div>
                </div>

                <div class="card animated">
                    <h3>Your Journey: Where This Actually Goes</h3>
                    <p style="color: #999; margin-bottom: 24px;">
                        This is the part most people don't see. The first year feels slow. But year 5? Year 10?
                        That's when compound growth gets wild.
                    </p>

                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <h4>Today: ${formatCurrency(currentRevenue)}/month</h4>
                            <p style="color: #999;">${getStageInsight(currentRevenue)}</p>
                        </div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <h4>1 Year: ${formatCurrency(year1)}/month</h4>
                            <p style="color: #999;">If you keep growing at 4% monthly. That's ${formatCurrency(year1 * 12)} per year.</p>
                        </div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <h4>3 Years: ${formatCurrency(year3)}/month</h4>
                            <p style="color: #999;">That's ${(year3 / currentRevenue).toFixed(1)}x what you're making now. ${formatCurrency(year3 * 12)} per year.</p>
                        </div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <h4>5 Years: ${formatCurrency(year5)}/month</h4>
                            <p style="color: #999;">This is where it gets serious. ${formatCurrency(year5 * 12)} per year. You've ${(year5 / currentRevenue).toFixed(0)}x'd your business.</p>
                        </div>
                    </div>

                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <h4>10 Years: ${formatCurrency(year10)}/month</h4>
                            <p style="color: #999;">
                                ${formatCurrency(year10 * 12)} per year. That's ${(year10 / currentRevenue).toFixed(0)}x your starting point.
                                This is the power of compound growth that most people never see because they quit in year 1.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card animated">
                    <h3>Why This Matters</h3>
                    <p style="color: #999; line-height: 1.8; margin-bottom: 16px;">
                        When you're growing at 4% monthly, it doesn't <em>feel</em> like winning. The numbers are small.
                        The progress is slow. You look at other people and think they're crushing it while you're stuck.
                    </p>
                    <p style="color: #fff; line-height: 1.8; font-size: 18px;">
                        But the truth? <strong style="color: #00d09c;">You're actually doing incredibly well.</strong>
                        60% yearly growth is exceptional. Most businesses fail. Most people never make a dollar online.
                        You're in the top tier — you just don't realize it yet.
                    </p>
                </div>
            `;
        }

        function showProjections() {
            document.getElementById('content').innerHTML = `
                <div class="card animated">
                    <h3>Play With Your Numbers</h3>
                    <p style="color: #999; margin-bottom: 24px;">
                        Slide this to see what happens if you grow faster (or slower) than 4% per month.
                        Even small changes make a huge difference over time.
                    </p>

                    <div class="slider-container">
                        <label style="color: #999; margin-bottom: 16px; display: block;">How much are you growing each month?</label>
                        <input type="range" class="slider" id="growthSlider" min="1" max="20" value="4" step="0.5" oninput="updateProjections()">
                        <div class="slider-value" id="sliderValue">4%</div>
                    </div>

                    <div id="projectionResults"></div>
                </div>

                <div class="card animated">
                    <h3>Month-by-Month: What This Actually Looks Like</h3>
                    <p style="color: #999; margin-bottom: 16px;">This is what your business looks like each month if you grow at 4% consistently:</p>
                    <table>
                        <thead>
                            <tr>
                                <th>Month</th>
                                <th>What You're Making</th>
                                <th>You Added This Month</th>
                                <th>If You Made This Every Month for a Year</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyTable"></tbody>
                    </table>
                </div>
            `;
            updateProjections();
        }

        function updateProjections() {
            const rate = parseFloat(document.getElementById('growthSlider').value);
            document.getElementById('sliderValue').textContent = rate + '%';

            const m12 = calculateRevenue(currentRevenue, 12, rate);
            const m24 = calculateRevenue(currentRevenue, 24, rate);
            const m36 = calculateRevenue(currentRevenue, 36, rate);
            const m60 = calculateRevenue(currentRevenue, 60, rate);
            const m120 = calculateRevenue(currentRevenue, 120, rate);

            document.getElementById('projectionResults').innerHTML = `
                <div class="metric-grid" style="margin-top: 24px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
                    <div class="metric">
                        <div class="metric-label">In 1 Year</div>
                        <div class="metric-value" style="font-size: 20px;">${formatCurrency(m12)}</div>
                        <div class="metric-subtext">per month</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">In 2 Years</div>
                        <div class="metric-value" style="font-size: 20px;">${formatCurrency(m24)}</div>
                        <div class="metric-subtext">per month</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">In 3 Years</div>
                        <div class="metric-value" style="font-size: 20px;">${formatCurrency(m36)}</div>
                        <div class="metric-subtext">per month</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">In 5 Years</div>
                        <div class="metric-value" style="font-size: 20px;">${formatCurrency(m60)}</div>
                        <div class="metric-subtext">per month</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">In 10 Years</div>
                        <div class="metric-value" style="font-size: 20px;">${formatCurrency(m120)}</div>
                        <div class="metric-subtext">per month</div>
                    </div>
                </div>

                <div class="highlight-box" style="margin-top: 24px;">
                    <div class="title">10-Year Total Revenue</div>
                    <div class="value">${formatCurrency((m12 + m24 + m36 + m60 + m120) * 12)}</div>
                    <div class="subtitle">Growing at ${rate}% per month from ${formatCurrency(currentRevenue)}/month</div>
                </div>

                <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 24px;">
                    <p style="color: #999; line-height: 1.8;">
                        At ${rate}% monthly growth, you'd ${(m120 / currentRevenue).toFixed(0)}x your business in 10 years.
                        That's the power of compound growth — it starts slow, then explodes.
                    </p>
                </div>
            `;

            // Update monthly table
            let tableHTML = '';
            for (let month = 0; month <= 12; month++) {
                const revenue = month === 0 ? currentRevenue : calculateRevenue(currentRevenue, month, rate);
                const growth = month === 0 ? 0 : revenue - calculateRevenue(currentRevenue, month - 1, rate);
                const annualRunRate = revenue * 12;

                tableHTML += `
                    <tr>
                        <td style="color: #999;">${month === 0 ? 'Today' : 'Month ' + month}</td>
                        <td style="font-weight: 700;">${formatCurrency(revenue)}</td>
                        <td style="color: #00d09c;">${month === 0 ? '-' : '+' + formatCurrency(growth)}</td>
                        <td style="color: #999;">${formatCurrency(annualRunRate)}</td>
                    </tr>
                `;
            }
            document.getElementById('monthlyTable').innerHTML = tableHTML;
        }

        function showComparison() {
            const year1 = calculateRevenue(currentRevenue, 12, 4);
            const year3 = calculateRevenue(currentRevenue, 36, 4);

            // Comparison to regular jobs
            const minWageHourly = 15; // Federal/state averages around this
            const minWageMonthly = minWageHourly * 40 * 4.33; // 40 hrs/week * 4.33 weeks/month
            const minWageYearly = minWageMonthly * 12;

            const collegeGradAvg = 55000; // Average entry-level college grad salary
            const collegeGradMonthly = collegeGradAvg / 12;

            const yourYearly = currentRevenue * 12;
            const yourYear1Yearly = year1 * 12;
            const yourYear3Yearly = year3 * 12;

            document.getElementById('content').innerHTML = `
                <div class="card animated" style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);">
                    <h3 style="font-size: 24px; margin-bottom: 16px;">What if you got a "real job" instead?</h3>
                    <p style="color: #999; font-size: 18px; line-height: 1.8;">
                        Everyone keeps telling you to get a real job, go to college, be realistic.
                        Let's compare what that actually means in dollars.
                    </p>
                </div>

                <div class="card animated">
                    <h3>Your Business vs Minimum Wage Job</h3>

                    <div class="comparison-card">
                        <div class="comparison-header">
                            <div class="comparison-title">Your Business Today</div>
                            <div class="comparison-badge">What You're Making</div>
                        </div>
                        <div class="comparison-value">${formatCurrency(yourYearly)}</div>
                        <div class="comparison-description">per year (${formatCurrency(currentRevenue)}/month)</div>
                    </div>

                    <div class="comparison-card" style="opacity: 0.6;">
                        <div class="comparison-header">
                            <div class="comparison-title">Minimum Wage Job</div>
                            <div class="comparison-badge" style="background: #666;">$${minWageHourly}/hr</div>
                        </div>
                        <div class="comparison-value" style="color: #999;">${formatCurrency(minWageYearly)}</div>
                        <div class="comparison-description">per year (40 hours/week)</div>
                    </div>

                    ${yourYearly > minWageYearly ? `
                        <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 16px;">
                            <p style="color: #00d09c; font-size: 18px; font-weight: 700;">
                                You're already making ${formatCurrency(yourYearly - minWageYearly)} MORE per year than minimum wage.
                            </p>
                            <p style="color: #999; margin-top: 12px; line-height: 1.6;">
                                And you're not trading hours for dollars. You're building something that can grow.
                            </p>
                        </div>
                    ` : `
                        <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 16px;">
                            <p style="color: #999; line-height: 1.6;">
                                You're not there yet, but at 4% monthly growth, you'll pass minimum wage income
                                in ${Math.ceil(calculateMonths(currentRevenue, minWageMonthly, 4))} months.
                            </p>
                            <p style="color: #fff; margin-top: 12px; line-height: 1.6;">
                                And when you do, you'll keep growing. A minimum wage job doesn't.
                            </p>
                        </div>
                    `}
                </div>

                <div class="card animated">
                    <h3>Your Business vs College Graduate Salary</h3>
                    <p style="color: #999; margin-bottom: 20px;">
                        Average entry-level salary for a college graduate is around ${formatCurrency(collegeGradAvg)}/year.
                        That's ${formatCurrency(collegeGradMonthly)}/month.
                    </p>

                    <div class="metric-grid">
                        <div class="metric">
                            <div class="metric-label">You Today</div>
                            <div class="metric-value">${formatCurrency(yourYearly)}</div>
                            <div class="metric-subtext">per year</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">You in 1 Year</div>
                            <div class="metric-value">${formatCurrency(yourYear1Yearly)}</div>
                            <div class="metric-subtext">at 4% monthly</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">You in 3 Years</div>
                            <div class="metric-value">${formatCurrency(yourYear3Yearly)}</div>
                            <div class="metric-subtext">at 4% monthly</div>
                        </div>
                    </div>

                    ${yourYear1Yearly > collegeGradAvg ? `
                        <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 24px;">
                            <p style="color: #00d09c; font-size: 18px; font-weight: 700; margin-bottom: 12px;">
                                In 1 year, you'll be making ${formatCurrency(yourYear1Yearly - collegeGradAvg)} MORE than the average college grad.
                            </p>
                            <p style="color: #999; line-height: 1.6;">
                                No student debt. No 4 years of school. No asking for permission for time off.
                                And you'll keep growing while they're stuck at the same salary.
                            </p>
                        </div>
                    ` : `
                        <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 24px;">
                            <p style="color: #fff; line-height: 1.6; margin-bottom: 12px;">
                                At 4% monthly growth, you'll match a college grad salary (${formatCurrency(collegeGradMonthly)}/month)
                                in about ${Math.ceil(calculateMonths(currentRevenue, collegeGradMonthly, 4))} months.
                            </p>
                            <p style="color: #999; line-height: 1.6;">
                                And you'll keep growing. They'll spend 4 years in school, rack up debt, and start at the same place
                                you'll be in ${(calculateMonths(currentRevenue, collegeGradMonthly, 4) / 12).toFixed(1)} years.
                            </p>
                        </div>
                    `}
                </div>

                <div class="card animated">
                    <h3>The Long Game: 10-Year Comparison</h3>
                    <p style="color: #999; margin-bottom: 20px; line-height: 1.6;">
                        Most people only think 1-2 years ahead. But here's what happens when you play the long game:
                    </p>

                    <div class="comparison-card">
                        <div class="comparison-title" style="margin-bottom: 12px;">Your Business (4% monthly growth)</div>
                        <table style="width: 100%;">
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 1</td>
                                <td style="text-align: right; font-weight: 700; padding: 8px 0;">${formatCurrency(yourYear1Yearly)}</td>
                            </tr>
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 3</td>
                                <td style="text-align: right; font-weight: 700; padding: 8px 0;">${formatCurrency(yourYear3Yearly)}</td>
                            </tr>
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 5</td>
                                <td style="text-align: right; font-weight: 700; padding: 8px 0;">${formatCurrency(calculateRevenue(currentRevenue, 60, 4) * 12)}</td>
                            </tr>
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 10</td>
                                <td style="text-align: right; font-weight: 700; padding: 8px 0;">${formatCurrency(calculateRevenue(currentRevenue, 120, 4) * 12)}</td>
                            </tr>
                        </table>
                    </div>

                    <div class="comparison-card" style="opacity: 0.6;">
                        <div class="comparison-title" style="margin-bottom: 12px;">College Grad Job (with 3% raises)</div>
                        <table style="width: 100%;">
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 1</td>
                                <td style="text-align: right; padding: 8px 0;">$0 (in school)</td>
                            </tr>
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 3</td>
                                <td style="text-align: right; padding: 8px 0;">$0 (in school)</td>
                            </tr>
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 5</td>
                                <td style="text-align: right; padding: 8px 0;">${formatCurrency(collegeGradAvg * 1.03)}</td>
                            </tr>
                            <tr>
                                <td style="color: #999; padding: 8px 0;">Year 10</td>
                                <td style="text-align: right; padding: 8px 0;">${formatCurrency(collegeGradAvg * Math.pow(1.03, 6))}</td>
                            </tr>
                        </table>
                    </div>

                    <div style="background: #0d0d0d; padding: 24px; border-radius: 8px; margin-top: 16px;">
                        <p style="color: #fff; line-height: 1.8; margin-bottom: 12px;">
                            <strong style="color: #00d09c;">Year 10:</strong> You're making ${formatCurrency(calculateRevenue(currentRevenue, 120, 4) * 12)}/year.
                            <br>
                            The college grad who started in year 4 is making ${formatCurrency(collegeGradAvg * Math.pow(1.03, 6))}/year.
                        </p>
                        <p style="color: #999; line-height: 1.8;">
                            That's a ${formatCurrency((calculateRevenue(currentRevenue, 120, 4) * 12) - (collegeGradAvg * Math.pow(1.03, 6)))} difference.
                            And they still have $80k in student debt.
                        </p>
                    </div>

                    <div class="highlight-box" style="margin-top: 24px;">
                        <div class="value">${(calculateRevenue(currentRevenue, 120, 4) * 12 / (collegeGradAvg * Math.pow(1.03, 6))).toFixed(1)}x</div>
                        <div class="subtitle">You'll be making ${(calculateRevenue(currentRevenue, 120, 4) * 12 / (collegeGradAvg * Math.pow(1.03, 6))).toFixed(1)}x more than them in year 10</div>
                    </div>
                </div>
            `;
        }


        function showMilestones() {
            const milestones = getMilestones(currentRevenue);

            document.getElementById('content').innerHTML = `
                <div class="card animated">
                    <h3>Your Next Goals</h3>
                    <p style="color: #999; margin-bottom: 24px; line-height: 1.6;">${getStageMessage(currentRevenue)}</p>

                    ${milestones.map(m => {
                        const progress = (currentRevenue / m.target) * 100;
                        return `
                            <div style="margin-bottom: 32px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <div>
                                        <div style="font-size: 24px; font-weight: 700; margin-bottom: 4px;">${formatCurrency(m.target)}/month</div>
                                        <div style="color: #999; font-size: 14px;">${m.context}</div>
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="color: #00d09c; font-size: 18px; font-weight: 700;">${m.months} months away</div>
                                        <div style="color: #999; font-size: 14px;">if you grow at 4%</div>
                                    </div>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${Math.min(progress, 100)}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="card animated">
                    <h3>How Growth Rate Changes Everything</h3>
                    <p style="color: #999; margin-bottom: 24px;">
                        This shows how much faster you'll hit ${formatCurrency(milestones[0].target)}/month at different growth rates.
                        Even 1-2% makes a huge difference.
                    </p>

                    ${generateMilestoneComparison(currentRevenue)}
                </div>
            `;
        }

        function getMilestones(revenue) {
            if (revenue < 100) {
                return [
                    { target: 100, months: Math.ceil(calculateMonths(revenue || 10, 100, 4)), context: "First proof you can make money online" },
                    { target: 500, months: Math.ceil(calculateMonths(revenue || 10, 500, 4)), context: "Covers real bills (phone, groceries, gas)" },
                    { target: 1000, months: Math.ceil(calculateMonths(revenue || 10, 1000, 4)), context: "Part-time income level" },
                ];
            } else if (revenue < 1000) {
                return [
                    { target: 1000, months: Math.ceil(calculateMonths(revenue, 1000, 4)), context: "Part-time income level" },
                    { target: 2000, months: Math.ceil(calculateMonths(revenue, 2000, 4)), context: "Serious side income" },
                    { target: 5000, months: Math.ceil(calculateMonths(revenue, 5000, 4)), context: "Could go full-time in many places" },
                ];
            } else if (revenue < 5000) {
                return [
                    { target: 5000, months: Math.ceil(calculateMonths(revenue, 5000, 4)), context: "Full-time income territory" },
                    { target: 10000, months: Math.ceil(calculateMonths(revenue, 10000, 4)), context: "Comfortable living, can hire help" },
                    { target: 20000, months: Math.ceil(calculateMonths(revenue, 20000, 4)), context: "Strong business with real options" },
                ];
            } else if (revenue < 20000) {
                return [
                    { target: 20000, months: Math.ceil(calculateMonths(revenue, 20000, 4)), context: "Top 5% of online businesses" },
                    { target: 50000, months: Math.ceil(calculateMonths(revenue, 50000, 4)), context: "Life-changing income, significant wealth" },
                    { target: 100000, months: Math.ceil(calculateMonths(revenue, 100000, 4)), context: "Six figures monthly, elite territory" },
                ];
            } else {
                return [
                    { target: 50000, months: Math.ceil(calculateMonths(revenue, 50000, 4)), context: "Life-changing income level" },
                    { target: 100000, months: Math.ceil(calculateMonths(revenue, 100000, 4)), context: "Six figures monthly" },
                    { target: 200000, months: Math.ceil(calculateMonths(revenue, 200000, 4)), context: "Top 0.1% of online businesses" },
                ];
            }
        }

        function generateMilestoneComparison(revenue) {
            const nextMilestone = getMilestones(revenue)[0].target;
            const rates = [2, 4, 6, 8];

            return `
                <table>
                    <thead>
                        <tr>
                            <th>If You Grow This Much Each Month</th>
                            <th>You'll Hit ${formatCurrency(nextMilestone)} in...</th>
                            <th>That's This Much Per Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rates.map(rate => {
                            const months = Math.ceil(calculateMonths(revenue, nextMilestone, rate));
                            const annualGrowth = ((Math.pow(1 + rate/100, 12) - 1) * 100).toFixed(0);
                            return `
                                <tr>
                                    <td style="font-weight: 700;">${rate}% per month</td>
                                    <td style="color: #00d09c;">${months} months (${(months/12).toFixed(1)} years)</td>
                                    <td style="color: #999;">${annualGrowth}% per year</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function getStageMessage(revenue) {
            if (revenue < 100) return "You're just starting out. Every dollar you make right now is proof this can work.";
            if (revenue < 1000) return "You've proven you can make money online. That's further than most people ever get.";
            if (revenue < 5000) return "This is real money. You're actually doing this.";
            if (revenue < 20000) return "You're making real income from this. This is what success looks like.";
            return "You're running a real business. Most people never get here.";
        }

        function getStageInsight(revenue) {
            if (revenue < 100) return "Most people never make their first dollar online. You're already ahead of everyone who just talks about it.";
            if (revenue < 1000) return `You're making ${formatCurrency(revenue)} per month. Most people quit before they get here. You didn't. Keep going.`;
            if (revenue < 5000) return `${formatCurrency(revenue)} per month is more than most part-time jobs. And you built this yourself.`;
            if (revenue < 20000) return `${formatCurrency(revenue)} per month is real income. Most people work 40 hours a week for less than this. You're winning.`;
            return `You're making ${formatCurrency(revenue)} per month. At 4% growth, you're adding ${formatCurrency(revenue * 0.04)} every single month. That's incredible.`;
        }

        // Auto-load overview on start
        document.addEventListener('DOMContentLoaded', function() {
            if (currentRevenue > 0) {
                showOverview();
            }
        });
    </script>
</body>
</html>
